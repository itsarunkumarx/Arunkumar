<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 495 195' width='495px' height='195px' direction='ltr'>
        <style>
            @keyframes currstreak {
                0% { font-size: 3px; opacity: 0.2; }
                80% { font-size: 34px; opacity: 1; }
                100% { font-size: 28px; opacity: 1; }
            }
            @keyframes fadein {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
        </style>
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='495' height='195' rx='6'/>
            </clipPath>
            <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
                <feGaussianBlur stdDeviation='3' result='blur'/>
                <feMerge>
                    <feMergeNode in='blur'/>
                    <feMergeNode in='SourceGraphic'/>
                </feMerge>
            </filter>
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#00d4ff' stroke-opacity='0.4' fill='#0d1117' rx='6' x='0.5' y='0.5' width='494' height='194'/>
            </g>
            <!-- Vertical Dividers -->
            <g style='isolation: isolate'>
                <line x1='165' y1='28' x2='165' y2='170' stroke-width='1' stroke='#1f293d' stroke-linecap='round'/>
                <line x1='330' y1='28' x2='330' y2='170' stroke-width='1' stroke='#1f293d' stroke-linecap='round'/>
            </g>
            <!-- Section 1: Total Contributions -->
            <g style='isolation: isolate'>
                <g transform='translate(82.5, 48)'>
                    <text x='0' y='32' text-anchor='middle' fill='#ffffff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                        350+
                    </text>
                </g>
                <g transform='translate(82.5, 84)'>
                    <text x='0' y='32' text-anchor='middle' fill='#00d4ff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>
                        Total Contributions
                    </text>
                </g>
                <g transform='translate(82.5, 114)'>
                    <text x='0' y='32' text-anchor='middle' fill='#8b949e' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>
                        2023 - Present
                    </text>
                </g>
            </g>
            <!-- Section 2: Current Streak (Center with Ring & Flame) -->
            <g style='isolation: isolate'>
                <g transform='translate(247.5, 38)'>
                    <!-- Streak Ring -->
                    <circle cx='0' cy='18' r='32' stroke='#1f293d' stroke-width='4' fill='none'/>
                    <circle cx='0' cy='18' r='32' stroke='#00d4ff' stroke-width='4' stroke-dasharray='200' stroke-dashoffset='40' fill='none' filter='url(#glow)' transform='rotate(-90)'/>
                    <!-- Fire Icon / Center text -->
                    <text x='0' y='27' text-anchor='middle' fill='#ffffff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='24px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                        🔥
                    </text>
                </g>
                <g transform='translate(247.5, 108)'>
                    <text x='0' y='24' text-anchor='middle' fill='#00d4ff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                        Active Streak
                    </text>
                </g>
                <g transform='translate(247.5, 134)'>
                    <text x='0' y='20' text-anchor='middle' fill='#38bdae' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='600' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 1s'>
                        Daily Active Developer
                    </text>
                </g>
            </g>
            <!-- Section 3: Longest Streak / Consistency -->
            <g style='isolation: isolate'>
                <g transform='translate(412.5, 48)'>
                    <text x='0' y='32' text-anchor='middle' fill='#ffffff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                        100%
                    </text>
                </g>
                <g transform='translate(412.5, 84)'>
                    <text x='0' y='32' text-anchor='middle' fill='#00d4ff' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>
                        Commit Consistency
                    </text>
                </g>
                <g transform='translate(412.5, 114)'>
                    <text x='0' y='32' text-anchor='middle' fill='#8b949e' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>
                        Continuous Growth
                    </text>
                </g>
            </g>
        </g>
</svg>
